name: Daily startup news briefing

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-startup-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      # 외부 알람(cron-job.org 등)이 workflow_dispatch로 오전에 먼저 수집하면,
      # 몇 시간 늦게 시작되는 예약 실행(schedule)은 같은 날 브리핑을 다시 만들지 않고 끝낸다.
      # 오늘 수집이 실패했거나 아직 없으면 예약 실행이 그대로 수집해 안전망 역할을 한다.
      # 수동 실행(workflow_dispatch)은 항상 수집한다.
      - name: 오늘 브리핑 완료 여부 확인
        id: guard
        if: ${{ github.event_name == 'schedule' }}
        run: |
          today="$(TZ=Asia/Seoul date '+%Y-%m-%d')"
          git fetch --depth=1 origin "${GITHUB_REF_NAME}" || true
          status_json="$(git show "origin/${GITHUB_REF_NAME}:data/status.json" 2>/dev/null || cat data/status.json 2>/dev/null || echo '{}')"
          done="$(printf '%s' "$status_json" | jq -r --arg today "$today" \
            'if .success == true and .briefingDate == $today and ((.finalArticleCount // 0) > 0) then "true" else "false" end' \
            2>/dev/null || echo false)"
          echo "today_kst=${today} already_done=${done}"
          echo "skip=${done}" >> "$GITHUB_OUTPUT"
          if [ "$done" = "true" ]; then
            echo "::notice::오늘(${today}) 브리핑이 이미 수집되어 예약 실행은 건너뜁니다."
          fi

      - name: pnpm 설정
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Node.js 설정
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 의존성 설치
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: pnpm install --frozen-lockfile

      # Feed snapshot 워크플로가 모아 둔 RSS 기사 목록. 없거나 실패해도 수집은 그대로 진행된다.
      - name: RSS 기사 버퍼 불러오기
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .cache/feed-buffer.json
          key: feed-buffer-none-${{ github.run_id }}
          restore-keys: |
            feed-buffer-

      - name: 실행 환경 디버그 정보
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "utc_now=$(date -u '+%Y-%m-%d %H:%M:%S %Z')"
          echo "kst_now=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "branch=${GITHUB_REF_NAME}"

      - name: 최근 48시간 뉴스 수집
        if: ${{ steps.guard.outputs.skip != 'true' }}
        env:
          USE_OPENAI_SUMMARY: ${{ vars.USE_OPENAI_SUMMARY || 'false' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_SUMMARY_MODEL: ${{ vars.OPENAI_SUMMARY_MODEL || 'gpt-5.4-mini' }}
          OPENAI_REQUEST_DELAY_MS: ${{ vars.OPENAI_REQUEST_DELAY_MS || '7000' }}
          OPENAI_MAX_RETRIES: ${{ vars.OPENAI_MAX_RETRIES || '2' }}
          OPENAI_DAILY_CALL_BUDGET: ${{ vars.OPENAI_DAILY_CALL_BUDGET || '12' }}
          OPENAI_ARTICLE_TEXT_MAX_CHARS: ${{ vars.OPENAI_ARTICLE_TEXT_MAX_CHARS || '3500' }}
          OPENAI_BODY_MAX_ITEMS: ${{ vars.OPENAI_BODY_MAX_ITEMS || '8' }}
          OPENAI_DESCRIPTION_MAX_ITEMS: ${{ vars.OPENAI_DESCRIPTION_MAX_ITEMS || '6' }}
          USE_FULL_TEXT_EXTRACTION: ${{ vars.USE_FULL_TEXT_EXTRACTION || 'true' }}
          ARTICLE_FETCH_TIMEOUT_MS: ${{ vars.ARTICLE_FETCH_TIMEOUT_MS || '8000' }}
          MAX_ARTICLE_FETCH_CONCURRENCY: ${{ vars.MAX_ARTICLE_FETCH_CONCURRENCY || '3' }}
          MIN_ARTICLE_TEXT_LENGTH: ${{ vars.MIN_ARTICLE_TEXT_LENGTH || '300' }}
          MAX_TITLE_FALLBACK_ITEMS: ${{ vars.MAX_TITLE_FALLBACK_ITEMS || '0' }}
          FORCE_SAVE_EMPTY: ${{ vars.FORCE_SAVE_EMPTY || 'false' }}
          MAX_ITEMS_PER_CATEGORY: ${{ vars.MAX_ITEMS_PER_CATEGORY || '5' }}
          ALLOW_UNLISTED_SOURCES: ${{ vars.ALLOW_UNLISTED_SOURCES || 'false' }}
          ENABLE_DISCOVERY_FALLBACK: ${{ vars.ENABLE_DISCOVERY_FALLBACK || 'false' }}
          DISCOVERY_MAX_RESULTS_PER_QUERY: ${{ vars.DISCOVERY_MAX_RESULTS_PER_QUERY || '5' }}
          DISCOVERY_MAX_TOTAL_RESULTS: ${{ vars.DISCOVERY_MAX_TOTAL_RESULTS || '40' }}
          DISCOVERY_REQUIRE_ORIGINAL_URL: ${{ vars.DISCOVERY_REQUIRE_ORIGINAL_URL || 'true' }}
          ENABLE_CANDIDATE_SOURCES: ${{ vars.ENABLE_CANDIDATE_SOURCES || 'false' }}
        run: pnpm run collect

      - name: 변경된 뉴스 데이터 커밋
        # 수집 단계가 실패해도 실패 상태(status.json)는 커밋되도록 취소된 경우만 제외한다.
        if: ${{ !cancelled() && steps.guard.outputs.skip != 'true' }}
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/archive data/status.json
          if [ -f data/insights.json ]; then
            git add data/insights.json
          fi
          # summary-cache.json은 .gitignore 대상이라 -f 없이는 git add가 실패해 커밋 전체가 중단된다.
          if [ -f data/summary-cache.json ]; then
            git add -f data/summary-cache.json
          fi

          if git diff --cached --quiet; then
            echo "변경된 뉴스 데이터가 없습니다."
          else
            git commit -m "chore: update daily news briefing" || echo "::warning::자동 커밋에 실패했습니다."
            git push || echo "::warning::자동 푸시에 실패했습니다. 저장소 권한을 확인하세요."
          fi
